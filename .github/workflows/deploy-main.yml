# Runs automatically when a PR is merged into main.
# Deploys all source to the dev org and runs all local Apex tests.

name: Deploy to Dev Org

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'force-app/**'
      - 'manifest/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy metadata to dev-org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set npm global prefix to home
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Cache sf CLI
        id: cache-sf
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: sf-cli-${{ runner.os }}-v7
          restore-keys: sf-cli-${{ runner.os }}-

      - name: Install sf CLI
        if: steps.cache-sf.outputs.cache-hit != 'true'
        run: npm install -g @salesforce/cli

      - name: Authenticate to dev org via SFDX Auth URL
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > /tmp/sfdx_auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx_auth.txt --alias dev-org --set-default
          rm /tmp/sfdx_auth.txt

      - name: Deploy to dev org (RunLocalTests)
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org dev-org \
            --test-level RunLocalTests \
            --wait 30 \
            --json

      - name: Verify deploy status
        run: sf project deploy report --use-most-recent --json

      - name: Check if destructive changes manifest was modified
        id: check-destructive
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            if git diff --name-only HEAD~1 HEAD -- manifest/destructiveChanges.xml | grep -q .; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Apply destructive changes
        if: success() && steps.check-destructive.outputs.changed == 'true'
        run: |
          sf project deploy start \
            --manifest manifest/package-empty.xml \
            --post-destructive-changes manifest/destructiveChanges.xml \
            --target-org dev-org \
            --test-level RunLocalTests \
            --wait 30 \
            --json

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deploy failed. Check the logs above for details."
          exit 1

      - name: Job summary
        if: always()
        run: |
          echo "## Deploy to Dev Org Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy + RunLocalTests | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destructive changes | applied on success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }} on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
